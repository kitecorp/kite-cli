# Release workflow for Kite CLI
#
# Builds native images for macOS (ARM64, x64) and Linux (x64),
# creates a GitHub release, and publishes to Homebrew.
#
# Note: Clones parent repo (kitecorp/kite) because kite-cli depends on :engine module
#
# Required secrets:
#   JRELEASER_GITHUB_TOKEN - GitHub token with repo scope (for homebrew-tap repo)
#
# To trigger: Create a GitHub release or run manually via workflow_dispatch

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

jobs:
  # Build native images on each platform
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14          # ARM64
            platform: osx-aarch64
            artifact: kite-osx-aarch64
          - os: macos-13          # x64
            platform: osx-x86_64
            artifact: kite-osx-x86_64
          - os: ubuntu-latest     # x64
            platform: linux-x86_64
            artifact: kite-linux-x86_64

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          repository: kitecorp/kite
          submodules: recursive

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native image
        run: ./gradlew :kite-cli:nativeCompile

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Package native image
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p build/distributions
          cp kite-cli/build/native/nativeCompile/kite build/distributions/
          cd build/distributions
          zip kite-$VERSION-${{ matrix.platform }}.zip kite
          rm kite

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/distributions/*.zip

  # Create release and publish to Homebrew
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/distributions
          merge-multiple: true

      - name: List artifacts
        run: ls -la build/distributions/

      - name: Run JReleaser
        uses: jreleaser/release-action@v2
        with:
          version: latest
          arguments: full-release
        env:
          JRELEASER_PROJECT_VERSION: ${{ steps.version.outputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-output
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
