# CI workflow for Kite CLI
#
# Runs tests on every push and pull request
#
# Note: Clones parent repo (kitecorp/kite) because kite-cli depends on :engine module

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout parent repo
        uses: actions/checkout@v4
        with:
          repository: kitecorp/kite
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :kite-cli:build

      - name: Test
        run: ./gradlew :kite-cli:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: 'kite-cli/build/reports/tests/'
