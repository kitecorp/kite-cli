plugins {
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.3'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'maven-publish'
    id 'signing'
    id 'org.jreleaser' version '1.22.0'  // For Maven Central via Central Portal
}

group = 'cloud.kitelang'
version = '0.3.4'

repositories {
    mavenCentral()
}

def lombok = '1.18.42'

def jackson = '3.0.3'

dependencies {
    implementation project(':engine')

    // SLF4J with JDK logging (GraalVM compatible)
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'

    implementation 'info.picocli:picocli:4.7.7'

    // JLine3 for interactive terminal UI
    implementation 'org.jline:jline:3.30.6'
    implementation 'org.jline:jline-console-ui:3.30.6'
    implementation 'info.picocli:picocli-shell-jline3:4.7.7'

    // For config file loading (Jackson 3.x uses new groupId)
    implementation "tools.jackson.core:jackson-databind:$jackson"
    implementation "tools.jackson.dataformat:jackson-dataformat-yaml:$jackson"

    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"

    // BouncyCastle JSSE - required for GraalVM native-image analysis of Netty SSL
    // (Netty references BC classes via reflection, GraalVM needs them at build time)
    compileOnly 'org.bouncycastle:bcpkix-jdk18on:1.80'
    compileOnly 'org.bouncycastle:bctls-jdk18on:1.80'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'
    testCompileOnly "org.projectlombok:lombok:${lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    withJavadocJar()
    withSourcesJar()
}

application {
    mainClass = 'cloud.kitelang.cli.KiteCLI'
    applicationName = 'kite'
    // Enable native access for JLine terminal handling (required for Java 22+)
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}


jar {
    archiveBaseName = "kite-cli"
}

// Fat JAR with all dependencies
shadowJar {
    archiveBaseName = "kite"
    archiveClassifier = "fat"
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'cloud.kitelang.cli.KiteCLI'
    }
}


test {
    useJUnitPlatform()
}

// Generate version.properties with the project version
tasks.register('generateVersionProperties') {
    def outputDir = layout.buildDirectory.dir('generated/resources')
    outputs.dir(outputDir)

    doLast {
        def propsFile = outputDir.get().file('version.properties').asFile
        propsFile.parentFile.mkdirs()
        propsFile.text = "version=${project.version}\n"
    }
}

// Update version.json for GitHub Pages (latest version endpoint)
tasks.register('updateVersionJson') {
    group = 'publishing'
    description = 'Update version.json with current project version'

    inputs.property('version', project.version)
    outputs.file('version.json')

    doLast {
        def versionFile = file('version.json')
        def json = new groovy.json.JsonSlurper().parse(versionFile)
        def currentVersion = project.version.toString()

        json.latest = currentVersion
        if (!json.versions.contains(currentVersion)) {
            json.versions.add(0, currentVersion)
            def output = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            // Use 2-space indent and add trailing newline
            versionFile.text = output.replaceAll('    ', '  ') + '\n'
            println "Updated version.json: latest = ${currentVersion}"
        }
    }
}

processResources.dependsOn updateVersionJson

// Include generated resources in the build
sourceSets {
    main {
        resources {
            srcDir layout.buildDirectory.dir('generated/resources')
        }
    }
}

processResources {
    dependsOn generateVersionProperties
}

// Ensure sourcesJar runs after version properties are generated
tasks.named('sourcesJar') {
    dependsOn generateVersionProperties
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

// GraalVM native image configuration (for future use)
// Build with: ./gradlew :kite-cli:nativeCompile
graalvmNative {
    binaries {
        main {
            imageName.set('kite')
            mainClass.set('cloud.kitelang.cli.KiteCLI')
            buildArgs.addAll(
                    '--no-fallback',
                    '-H:+UnlockExperimentalVMOptions',
                    '-H:+ReportExceptionStackTraces',
                    // Enable native access for JLine terminal (suppresses Java 22+ warnings)
                    // -J flag is for build-time JVM, --enable-native-access is for runtime binary
                    '-J--enable-native-access=ALL-UNNAMED',
                    '--enable-native-access=ALL-UNNAMED',
                    // SLF4J with JDK logging - much simpler than Log4j for native images
                    '--initialize-at-build-time=org.slf4j',
                    // Netty SSL/TLS - initialize at run-time (native libs and BouncyCastle are optional)
                    '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.handler.ssl',
                    '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.internal.tcnative',
                    '--initialize-at-run-time=io.netty.handler.ssl',
                    '--initialize-at-run-time=io.netty.internal.tcnative',
                    '--enable-url-protocols=http,https',
                    '-H:IncludeResources=.+\\.(properties|yml|yaml|kite|sql|md|template)$',
                    '-H:IncludeResources=templates/.*',
                    '-H:IncludeResources=db/.*',
                    '-H:IncludeResources=META-INF/.*',
                    // JLine3 resources
                    '--initialize-at-run-time=org.jline',
                    '-H:IncludeResources=org/jline/.*'
            )
        }
    }
    toolchainDetection = true
}

// Generate man pages using picocli-codegen
tasks.register('generateManPages', JavaExec) {
    dependsOn classes
    group = 'documentation'
    description = 'Generate man pages for the CLI'

    mainClass = 'picocli.codegen.docgen.manpage.ManPageGenerator'
    classpath = configurations.runtimeClasspath + sourceSets.main.output + configurations.annotationProcessor

    def outputDir = layout.buildDirectory.dir('docs/man')
    outputs.dir(outputDir)

    args = [
            'cloud.kitelang.cli.KiteCLI',
            '--outdir=' + outputDir.get().asFile.absolutePath
    ]
}

// Generate HTML documentation
tasks.register('generateHtmlDocs', JavaExec) {
    dependsOn classes
    group = 'documentation'
    description = 'Generate HTML documentation for the CLI'

    mainClass = 'picocli.codegen.docgen.manpage.ManPageGenerator'
    classpath = configurations.runtimeClasspath + sourceSets.main.output + configurations.annotationProcessor

    def outputDir = layout.buildDirectory.dir('docs/html')
    outputs.dir(outputDir)

    args = [
            'cloud.kitelang.cli.KiteCLI',
            '--outdir=' + outputDir.get().asFile.absolutePath,
            '--format=html'
    ]
}

// ========== Maven Central Publishing ==========

// JReleaser configuration for Maven Central via new Central Portal
jreleaser {
    signing {
        active = 'ALWAYS'
        armored = true
        mode = 'MEMORY'  // Use keys from environment variables
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    applyMavenCentralRules = true
                    retryDelay = 30
                    maxRetries = 60
                }
            }
        }
    }
}

publishing {
    publications {
        // Fat JAR with NO dependencies (for JBang, direct execution)
        mavenJava(MavenPublication) {
            artifactId = 'kite-cli'
            artifact(tasks.shadowJar) {
                classifier = null  // Remove 'fat' classifier - this is the main jar
            }

            pom {
                name = 'Kite CLI'
                description = 'Multi-cloud Infrastructure as Code CLI - standalone fat JAR with all dependencies bundled'
                url = 'https://github.com/kitecorp/kite-cli'
                packaging = 'jar'

                licenses {
                    license {
                        name = 'Apache License 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }

                developers {
                    developer {
                        id = 'kitecorp'
                        name = 'Kite Team'
                        url = 'https://github.com/kitecorp'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/kitecorp/kite-cli.git'
                    developerConnection = 'scm:git:ssh://github.com/kitecorp/kite-cli.git'
                    url = 'https://github.com/kitecorp/kite-cli'
                }

                // No dependencies - everything is bundled in the fat JAR
            }
        }
    }

    repositories {
        // Staging directory for JReleaser
        maven {
            name = "stagingDeploy"
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

// Sign all publications (only when GPG key is available)
signing {
    def signingKey = System.getenv("GPG_PRIVATE_KEY")
    def signingPassword = System.getenv("GPG_PASSPHRASE") ?: ""

    if (signingKey) {
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.mavenJava
    }
}

// Skip signing tasks when no GPG key is configured
tasks.withType(Sign).configureEach {
    onlyIf { System.getenv("GPG_PRIVATE_KEY") != null }
}

// Task to publish to Maven Central (via JReleaser -> Central Portal)
tasks.register('publishToMavenCentral') {
    group = 'publishing'
    description = 'Publish to Maven Central via JReleaser'
    dependsOn 'publishAllPublicationsToStagingDeployRepository'
    dependsOn 'jreleaserDeploy'
}

// Ensure staging happens before JReleaser deploy
tasks.named('jreleaserDeploy') {
    dependsOn 'publishAllPublicationsToStagingDeployRepository'
}
