plugins {
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.3'
}

group = 'io.kite'
version = '0.2.2'

repositories {
    mavenCentral()
}

def lombok = '1.18.42'

def jackson = '2.20.0'

dependencies {
    implementation project(':engine')

    // SLF4J with JDK logging (GraalVM compatible)
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-jdk14:2.0.17'

    implementation 'info.picocli:picocli:4.7.7'

    // For config file loading
    implementation "com.fasterxml.jackson.core:jackson-databind:$jackson"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:$jackson"

    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"

    // BouncyCastle JSSE - required for GraalVM native-image analysis of Netty SSL
    // (Netty references BC classes via reflection, GraalVM needs them at build time)
    compileOnly 'org.bouncycastle:bcpkix-jdk18on:1.80'
    compileOnly 'org.bouncycastle:bctls-jdk18on:1.80'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.7'
    testCompileOnly "org.projectlombok:lombok:${lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombok}"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
}

application {
    mainClass = 'cloud.kitelang.cli.KiteCLI'
    applicationName = 'kite'
}

distributions {
    main {
        distributionBaseName = "kite-${version}"
    }
}

jar {
    archiveBaseName = "kite-cli"
}

test {
    useJUnitPlatform()
}

compileJava {
    options.compilerArgs += ["-Aproject=${project.group}/${project.name}"]
}

// GraalVM native image configuration (for future use)
// Build with: ./gradlew :kite-cli:nativeCompile
graalvmNative {
    binaries {
        main {
            imageName.set('kite')
            mainClass.set('cloud.kitelang.cli.KiteCLI')
            buildArgs.addAll(
                '--no-fallback',
                '-H:+UnlockExperimentalVMOptions',
                '-H:+ReportExceptionStackTraces',
                // SLF4J with JDK logging - much simpler than Log4j for native images
                '--initialize-at-build-time=org.slf4j',
                // Netty SSL/TLS - initialize at run-time (native libs and BouncyCastle are optional)
                '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.handler.ssl',
                '--initialize-at-run-time=io.grpc.netty.shaded.io.netty.internal.tcnative',
                '--initialize-at-run-time=io.netty.handler.ssl',
                '--initialize-at-run-time=io.netty.internal.tcnative',
                '--enable-url-protocols=http,https',
                '-H:IncludeResources=.*\\.properties',
                '-H:IncludeResources=logging\\.properties'
            )
        }
    }
    toolchainDetection = true
}

// Generate man pages using picocli-codegen
tasks.register('generateManPages', JavaExec) {
    dependsOn classes
    group = 'documentation'
    description = 'Generate man pages for the CLI'

    mainClass = 'picocli.codegen.docgen.manpage.ManPageGenerator'
    classpath = configurations.runtimeClasspath + sourceSets.main.output + configurations.annotationProcessor

    def outputDir = layout.buildDirectory.dir('docs/man')
    outputs.dir(outputDir)

    args = [
        'cloud.kitelang.cli.KiteCLI',
        '--outdir=' + outputDir.get().asFile.absolutePath
    ]
}

// Generate HTML documentation
tasks.register('generateHtmlDocs', JavaExec) {
    dependsOn classes
    group = 'documentation'
    description = 'Generate HTML documentation for the CLI'

    mainClass = 'picocli.codegen.docgen.manpage.ManPageGenerator'
    classpath = configurations.runtimeClasspath + sourceSets.main.output + configurations.annotationProcessor

    def outputDir = layout.buildDirectory.dir('docs/html')
    outputs.dir(outputDir)

    args = [
        'cloud.kitelang.cli.KiteCLI',
        '--outdir=' + outputDir.get().asFile.absolutePath,
        '--format=html'
    ]
}
