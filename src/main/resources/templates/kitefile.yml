# Kite Configuration
# Project: {{projectName}}

# Default cloud provider for standard library types (Server, Network, Bucket, etc.)
# When using `resource Server backend { ... }` without @provider, this provider handles it.
defaultProvider: {{defaultProvider}}

# Provider plugins to install (global default for all environments)
dependencies:
{{dependencies}}

# Per-environment configuration
environments:
{{environments}}

# Logging configuration
# logs:
#   verbosity: info  # error, warn, info, debug, trace

# Provider process configuration (persistent mode)
# providers:
#   idleTimeout: 30m  # Auto-stop after 30 minutes of inactivity
#   persistent: true  # Keep providers running between CLI commands

# ─────────────────────────────────────────────────────────────────────────────
# Examples
# ─────────────────────────────────────────────────────────────────────────────
#
# Default provider for standard types:
#   defaultProvider: aws            # Server → Ec2Instance, Network → Vpc, etc.
#   defaultProvider: azure          # Server → VirtualMachine, Network → Vnet, etc.
#
# Dependencies (provider plugins):
#   dependencies:
#     - name: aws
#       version: 1.2.0              # Specific version
#     - name: gcp
#       version: latest             # Latest stable
#     - name: custom
#       git: github.com/myorg/provider
#       ref: v1.0.0                 # Build from source
#
# Terraform providers (3000+ providers via the bridge):
#   Use the tf/ prefix to access any Terraform provider from registry.terraform.io.
#   Kite automatically downloads, launches, and translates the provider.
#
#   dependencies:
#     - name: tf/aws                  # Terraform AWS provider
#       version: "~> 5.0"
#     - name: tf/datadog              # Monitoring
#       version: "~> 3.0"
#     - name: tf/cloudflare           # DNS & CDN
#       version: "~> 4.0"
#     - name: aws                     # Native Kite provider (can coexist)
#       version: 1.2.0
#
#   Usage in .kite files:
#
#     import Instance, SecurityGroup from "tf/aws"
#     import Monitor from "tf/datadog"
#
#     resource Instance web {
#       ami = "ami-0123456789"
#       instanceType = "t3.micro"     # camelCase (TF: instance_type)
#       tags = { Name: "web" }
#     }
#
#     # Data source lookup (TF data sources → @existing)
#     @existing
#     resource Ami latest {
#       mostRecent = true
#       filter = { name: "name", values: ["amzn2-*"] }
#     }
#
#   Naming conventions:
#     - Types: aws_instance → Instance (strip provider prefix, PascalCase)
#     - Properties: instance_type → instanceType (camelCase)
#     - Imports: import * from "tf/aws" (tf/ prefix)
#
#   Version constraints (same as Terraform):
#     "~> 5.0"       # >= 5.0.0, < 6.0.0
#     ">= 5.0"       # Any version >= 5.0.0
#     "5.82.0"        # Exact version
#
# Environments with custom directory:
#   environments:
#     - name: dev
#       dir: src/infra/dev           # Custom path (default: environments/<name>)
#       credentials:
#         - type: aws
#           profile: dev-sandbox
#           region: us-east-1
#         - type: aws
#           alias: west              # Multiple configs of same provider
#           profile: dev-sandbox
#           region: us-west-2
#
#     - name: prod
#       dependencies:                # Override provider version for this env
#         - name: aws
#           version: 1.1.0           # Use older stable version in prod
#       credentials:
#         - type: aws
#           profile: prod-account
#           region: us-east-1
#           role_arn: arn:aws:iam::123456789:role/DeployRole
#
# State backend is configured in ~/.kite/config.yml (secrets not in version control)
# Configure with: kite config state -e <environment>
#
# ─────────────────────────────────────────────────────────────────────────────
# Debugging
# ─────────────────────────────────────────────────────────────────────────────
#
# Set KITE_LOGGING to control log verbosity (overrides logs.verbosity above):
#   KITE_LOGGING=DEBUG kite apply -e dev    # Show debug logs and stack traces
#   KITE_LOGGING=TRACE kite apply -e dev    # Show all logs
#   KITE_LOGGING=ERROR kite apply -e dev    # Show only errors
