# Kite Configuration
# Project: {{projectName}}

# Provider plugins to install (global default for all environments)
dependencies:
{{dependencies}}

# Per-environment configuration
environments:
{{environments}}

# Logging configuration
# logs:
#   verbosity: info  # error, warn, info, debug, trace

# Provider process configuration (persistent mode)
# providers:
#   idleTimeout: 30m  # Auto-stop after 30 minutes of inactivity
#   persistent: true  # Keep providers running between CLI commands

# ─────────────────────────────────────────────────────────────────────────────
# Examples
# ─────────────────────────────────────────────────────────────────────────────
#
# Dependencies (provider plugins):
#   dependencies:
#     - name: aws
#       version: 1.2.0              # Specific version
#     - name: gcp
#       version: latest             # Latest stable
#     - name: custom
#       git: github.com/myorg/provider
#       ref: v1.0.0                 # Build from source
#
# Environments with custom directory:
#   environments:
#     - name: dev
#       dir: src/infra/dev           # Custom path (default: environments/<name>)
#       credentials:
#         - type: aws
#           profile: dev-sandbox
#           region: us-east-1
#         - type: aws
#           alias: west              # Multiple configs of same provider
#           profile: dev-sandbox
#           region: us-west-2
#
#     - name: prod
#       dependencies:                # Override provider version for this env
#         - name: aws
#           version: 1.1.0           # Use older stable version in prod
#       credentials:
#         - type: aws
#           profile: prod-account
#           region: us-east-1
#           role_arn: arn:aws:iam::123456789:role/DeployRole
#
# State backend is configured in ~/.kite/config.yml (secrets not in version control)
# Configure with: kite config state -e <environment>
#
# ─────────────────────────────────────────────────────────────────────────────
# Debugging
# ─────────────────────────────────────────────────────────────────────────────
#
# Set KITE_LOGGING to control log verbosity (overrides logs.verbosity above):
#   KITE_LOGGING=DEBUG kite apply -e dev    # Show debug logs and stack traces
#   KITE_LOGGING=TRACE kite apply -e dev    # Show all logs
#   KITE_LOGGING=ERROR kite apply -e dev    # Show only errors
