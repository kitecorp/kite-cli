# JDK logging configuration for Kite CLI
# This is used by SLF4J-JDK14 bridge

# Root logger level
.level=WARNING

# Console handler configuration
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[%4$s] %5$s%6$s%n

# Kite CLI logs at INFO by default
cloud.kitelang.cli.level=INFO

# Suppress verbose framework logs
org.hibernate.level=WARNING
com.zaxxer.hikari.level=WARNING
org.springframework.level=WARNING
io.grpc.level=WARNING
cloud.kitelang.engine.level=WARNING
